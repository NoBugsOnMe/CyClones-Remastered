# CyClones Remastered — base engine configuration (DOSBox Staging 0.83)
#
# These settings make the 1994 DOS game run correctly. The launcher adds a
# generated session.conf on top (monitor, picture, mouse, audio choices), and
# then config\custom.conf if you create one. Later files override earlier ones,
# so put personal tweaks in custom.conf rather than editing this file.

[sdl]
output = opengl
fullscreen_mode = standard
window_titlebar = program=(CyClones Remastered) dosbox=auto cycles=off mouse=short
screensaver = auto

[dosbox]
machine = svga_s3
memsize = 16
startup_verbosity = quiet
automount = off

[render]
aspect = on
viewport = fit
image_adjustments = on
crt_color_profile = auto

[cpu]
core = auto
cputype = auto
cpu_cycles = 3000
cpu_cycles_protected = 150000
cpu_throttle = off

[mixer]
rate = 48000

[midi]
# CyClones plays its music from the CD audio tracks, not MIDI.
mididevice = none

[sblaster]
# Must match game\drive_c\CYCLONE\SOUNDHMI.CFG (Sound Blaster 16, A220 I7 D1).
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
oplmode = auto

[speaker]
pcspeaker = off

[mouse]
mouse_raw_input = on
mouse_middle_release = on
